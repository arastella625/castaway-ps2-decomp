name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No game data, binaries or secrets
        run: python3 tools/check_repo.py
      - name: Tools compile
        run: python3 -m compileall -q tools pkg/tools
